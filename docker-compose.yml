services:
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - reports:/data/reports
      - ./docs:/data/seed:ro        # season seed for TrackPolicy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wow
      POSTGRES_PASSWORD: wow
      POSTGRES_DB: wow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  simulator:
    image: simulationcraftorg/simc:${SIMC_IMAGE_TAG}
    entrypoint: ["python3", "/app/worker.py"]
    volumes:
      - ./simulator/worker.py:/srv/worker.py:ro
      - simwork:/work
      - reports:/data/reports
    environment:
      DATABASE_URL: postgresql+psycopg2://wow:wow@postgres:5432/wow
      SIMC_PATH: /app/SimulationCraft/simc
      SIM_TIMEOUT_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  reports:
  simwork:
  caddydata:
