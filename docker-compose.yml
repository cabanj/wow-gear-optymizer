services:
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - reports:/data/reports
      - ./docs:/data/seed:ro        # season seed for TrackPolicy
    ports:
      - "127.0.0.1:8001:8000"       # host nginx/caddy proxies; 8000 taken by Honcho
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wow
      POSTGRES_PASSWORD: wow
      POSTGRES_DB: wow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  simulator:
    image: simulationcraftorg/simc:${SIMC_IMAGE_TAG}
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache python3 py3-pip >/dev/null 2>&1 && python3 /srv/worker.py"]
    volumes:
      - ./simulator/worker.py:/srv/worker.py:ro
      - simwork:/work
      - reports:/data/reports
    environment:
      DATABASE_URL: postgresql://wow:wow@postgres:5432/wow
      SIMC_PATH: /app/SimulationCraft/simc
      SIM_TIMEOUT_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  reports:
  simwork:
